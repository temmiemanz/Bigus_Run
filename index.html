<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bigus Run</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden;
                   position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
                   -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                   -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; background: #111;
              touch-action: none; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
                 font-family: sans-serif; color: #fff; }
      #loading h1 { font-size: 28px; margin: 0 0 14px; }
      #bar { width: 260px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #e8554a; }
      #err { position: fixed; left: 0; right: 0; bottom: 0; color: #fff; font-family: sans-serif; padding: 8px; display: none; background: #a22; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Bigus Run</h1>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="err"></div>
    <script>
// Bigus Run net (browser side). Players connect straight to each other with WebRTC.
// The rooms worker only introduces them. Loaded by index.html and by nettest.html.
// The Unity game talks to this through BigusNet functions in RunGuard.jslib.
(function () {
  var LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var STUN = [{ urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302"] }];
  var CONNECT_MS = 12000;

  var net = window.bigusNet = {
    state: "idle",          // idle, signaling, ready, error
    isHost: false, code: "", myId: -1, base: "", version: 0, myName: "Player",
    peers: {},              // id -> { pc, r, u, rOpen, uOpen, attempt, timer, name }
    events: [], inbox: [],
    ws: null, ice: STUN, turnTried: false, hostTries: 0,
    log: function () {}
  };

  function ev(o) { net.events.push(JSON.stringify(o)); }
  var gone = {};
  function emitClosed(id) { if (gone[id]) return; gone[id] = true; ev({ e: "closed", id: id }); }
  function wsUrl(code, role) {
    var b = net.base.replace(/\/+$/, "").replace(/^http/, "ws");
    return b + "/room/" + code + "?role=" + role + "&v=" + net.version + "&n=" + encodeURIComponent(net.myName);
  }
  function randCode() {
    var a = new Uint8Array(6); crypto.getRandomValues(a);
    var s = ""; for (var i = 0; i < 6; i++) s += LETTERS.charAt(a[i] % LETTERS.length);
    return s;
  }
  function sendSig(to, obj) {
    if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify({ t: "sig", to: to, d: JSON.stringify(obj) }));
  }

  function fetchIce(cb) {
    var url = net.base.replace(/\/+$/, "") + "/ice";
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.iceServers && j.iceServers.length) net.ice = j.iceServers;
      cb();
    }).catch(function () { cb(); });
  }

  // ---------- one connection to one other player ----------
  function newPeer(id, attempt) {
    var old = net.peers[id];
    if (old) { try { old.pc.close(); } catch (e) {} clearTimeout(old.timer); }
    var pc = new RTCPeerConnection({ iceServers: net.ice });
    var p = net.peers[id] = { pc: pc, r: null, u: null, rOpen: false, uOpen: false, attempt: attempt, timer: 0, done: false, name: (old && old.name) || "" };
    pc.onicecandidate = function (e) {
      if (e.candidate) sendSig(id, { a: attempt, k: "ice", s: e.candidate });
    };
    pc.onconnectionstatechange = function () {
      var st = pc.connectionState;
      if ((st === "failed" || st === "closed" || st === "disconnected") && p.done && net.peers[id] === p) {
        p.done = false; emitClosed(id);
      }
    };
    p.timer = setTimeout(function () { if (!p.done && net.peers[id] === p) retry(id); }, CONNECT_MS);
    return p;
  }
  function hook(p, id, dc, chan) {
    dc.binaryType = "arraybuffer";
    dc.onopen = function () {
      if (chan === 0) p.rOpen = true; else p.uOpen = true;
      if (p.rOpen && p.uOpen && !p.done) {
        p.done = true; clearTimeout(p.timer); delete gone[id];
        ev({ e: "open", id: id, name: p.name });
      }
    };
    dc.onclose = function () { if (p.done && net.peers[id] === p) { p.done = false; emitClosed(id); } };
    dc.onmessage = function (m) {
      var b = new Uint8Array(m.data), o = new Uint8Array(b.length + 2);
      o[0] = id; o[1] = chan; o.set(b, 2);
      net.inbox.push(o);
      if (net.inbox.length > 4000) net.inbox.shift();
    };
  }
  function retry(id) {
    var p = net.peers[id];
    if (!p || p.done) return;
    if (net.turnTried) { ev({ e: "error", err: "connect-timeout", id: id }); return; }
    net.turnTried = true;
    fetchIce(function () { if (net.isHost) startOffer(id, p.attempt + 1); });   // the host starts again, the joiner follows its offer
  }
  function startOffer(id, attempt) {
    var p = newPeer(id, attempt);
    p.r = p.pc.createDataChannel("r", { ordered: true });
    p.u = p.pc.createDataChannel("u", { ordered: false, maxRetransmits: 0 });
    hook(p, id, p.r, 0); hook(p, id, p.u, 1);
    p.pc.createOffer().then(function (o) { return p.pc.setLocalDescription(o); }).then(function () {
      sendSig(id, { a: attempt, k: "offer", s: p.pc.localDescription });
    }).catch(function (e) { ev({ e: "error", err: "offer", id: id }); });
  }
  function onSig(from, d) {
    var m; try { m = JSON.parse(d); } catch (e) { return; }
    var p = net.peers[from];
    if (m.k === "offer" && !net.isHost) {
      var go = function () {
        p = newPeer(from, m.a);
        p.pc.ondatachannel = function (e) { hook(p, from, e.channel, e.channel.label === "r" ? 0 : 1); if (e.channel.label === "r") p.r = e.channel; else p.u = e.channel; };
        p.pc.setRemoteDescription(m.s).then(function () { return p.pc.createAnswer(); }).then(function (a) { return p.pc.setLocalDescription(a); }).then(function () {
          sendSig(from, { a: m.a, k: "answer", s: p.pc.localDescription });
        }).catch(function () { ev({ e: "error", err: "answer", id: from }); });
      };
      if (m.a > 0 && !net.turnTried) { net.turnTried = true; fetchIce(go); } else go();
    } else if (m.k === "answer" && net.isHost && p && p.attempt === m.a) {
      p.pc.setRemoteDescription(m.s).catch(function () {});
    } else if (m.k === "ice" && p && p.attempt === m.a) {
      p.pc.addIceCandidate(m.s).catch(function () {});
    }
  }

  // ---------- signaling socket ----------
  function openSocket(code, role, onFail) {
    var ws = new WebSocket(wsUrl(code, role));
    net.ws = ws;
    ws.onmessage = function (m) {
      var j; try { j = JSON.parse(m.data); } catch (e) { return; }
      if (j.t === "hosted") { net.state = "ready"; net.code = code; net.myId = 0; ev({ e: "hosted", code: code }); }
      else if (j.t === "welcome") { net.state = "ready"; net.code = code; net.myId = j.id; ev({ e: "joined", id: j.id, host: j.host }); net.peers[0] = net.peers[0] || { name: j.host }; }
      else if (j.t === "join") { if (net.isHost) { net.peers[j.id] = { name: j.name, pc: { close: function () {} }, timer: 0, done: false, attempt: 0 }; fetchIceIfNeeded(function () { startOffer(j.id, 0); net.peers[j.id].name = j.name; }); ev({ e: "peer", id: j.id, name: j.name }); } }
      else if (j.t === "left") { var q = net.peers[j.id]; if (q && q.done) return; if (q) { try { q.pc.close(); } catch (e) {} clearTimeout(q.timer); delete net.peers[j.id]; } emitClosed(j.id); }
      else if (j.t === "closed") { var h = net.peers[0]; if (!(h && h.done)) emitClosed(0); }
      else if (j.t === "sig") onSig(j.from, j.d);
      else if (j.t === "error") { if (onFail) onFail(j.err); else { net.state = "error"; ev({ e: "error", err: j.err }); } }
    };
    ws.onerror = function () { if (net.ws === ws && net.state === "signaling") { net.state = "error"; ev({ e: "error", err: "network" }); } };
    ws.onclose = function () { if (net.ws === ws && net.state === "signaling") { net.state = "error"; ev({ e: "error", err: "network" }); } };
  }
  function fetchIceIfNeeded(cb) { cb(); }

  // ---------- public ----------
  net.reset = function () {
    for (var id in net.peers) { try { net.peers[id].pc.close(); } catch (e) {} clearTimeout(net.peers[id].timer); }
    net.peers = {}; net.events = []; net.inbox = []; gone = {};
    if (net.ws) { try { net.ws.onclose = null; net.ws.close(); } catch (e) {} }
    net.ws = null; net.state = "idle"; net.code = ""; net.myId = -1; net.turnTried = false; net.ice = STUN;
  };
  net.host = function (base, version, name) {
    net.reset(); net.isHost = true; net.base = base; net.version = version; net.myName = name || "Player"; net.state = "signaling"; net.hostTries = 0;
    var tryCode = function () {
      var code = randCode();
      openSocket(code, "host", function (err) {
        if (err === "taken" && ++net.hostTries < 6) tryCode();
        else { net.state = "error"; ev({ e: "error", err: err }); }
      });
    };
    tryCode();
  };
  net.join = function (base, code, version, name) {
    net.reset(); net.isHost = false; net.base = base; net.version = version; net.myName = name || "Player"; net.state = "signaling";
    openSocket(String(code).toUpperCase(), "join", null);
  };
  net.leave = function () { net.reset(); };
  // host stops taking new players (game started)
  net.lock = function () { if (net.isHost && net.ws) { try { net.ws.onclose = null; net.ws.close(); } catch (e) {} net.ws = null; } };
  net.send = function (to, bytes, reliable) {
    var send1 = function (p) {
      var dc = reliable ? p.r : p.u;
      if (dc && dc.readyState === "open") dc.send(bytes);
    };
    if (to === 255) { for (var id in net.peers) if (net.peers[id].done) send1(net.peers[id]); }
    else { var p = net.peers[to]; if (p && p.done) send1(p); }
  };
  net.pollEvent = function () { return net.events.length ? net.events.shift() : ""; };
  net.pollData = function () { return net.inbox.length ? net.inbox.shift() : null; };
})();

    </script>
    <script>
      var canvas = document.querySelector("#game");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/89a4a06b66f44f04d1cae3a67c270fbf.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/eefe4f8e696f36555c191265380909c5.data",
        frameworkUrl: buildUrl + "/012186d1ab77b8ec1412eca6b375e43e.framework.js",
        codeUrl: buildUrl + "/2089eb425c3b398c9bfeadaeff999213.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TemmieManz",
        productName: "Bigus Run",
        productVersion: "Beta",
        showBanner: function (msg, type) {
          if (type == "error") { var e = document.querySelector("#err"); e.style.display = "block"; e.textContent = msg; }
        }
      };

      // ---- phone / tablet fixes: exact canvas size, no zoom, no scroll, no page gestures ----
      var isTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                    (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
      function fitCanvas() {
        var vv = window.visualViewport;
        var w = Math.round(vv ? vv.width : window.innerWidth);
        var h = Math.round(vv ? vv.height : window.innerHeight);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        // when the keyboard opens, follow the visible part of the page
        canvas.style.left = Math.round(vv ? vv.offsetLeft : 0) + "px";
        canvas.style.top = Math.round(vv ? vv.offsetTop : 0) + "px";
      }
      fitCanvas();
      var fitTimer = 0;
      function refit() {
        fitCanvas();
        clearTimeout(fitTimer);
        // the browser bar / rotation settles a moment later, so fit again and tell the game
        fitTimer = setTimeout(function () { fitCanvas(); window.dispatchEvent(new Event("resize")); }, 250);
      }
      window.addEventListener("resize", refit);
      window.addEventListener("orientationchange", refit);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", refit);
        window.visualViewport.addEventListener("scroll", fitCanvas);
      }
      if (isTouch) {
        var stop = function (e) { if (e.cancelable) e.preventDefault(); };
        document.addEventListener("touchmove", stop, { passive: false });
        document.addEventListener("gesturestart", stop);
        document.addEventListener("gesturechange", stop);
        document.addEventListener("gestureend", stop);
        document.addEventListener("contextmenu", stop);
        var lastTap = 0;
        document.addEventListener("touchend", function (e) {
          var now = Date.now();
          if (now - lastTap < 350) stop(e); // no double tap zoom
          lastTap = now;
        }, { passive: false });
        // sharp enough, but kinder to phones
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      // ---- phone keyboard: a hidden box opens the browser keyboard and sends typing to the game ----
      (function () {
        var SENT = "\u200b";        // marker so Backspace still works when the box is empty
        var el = document.createElement("input");
        el.type = "text";
        el.setAttribute("autocomplete", "off");
        el.setAttribute("autocorrect", "off");
        el.setAttribute("autocapitalize", "off");
        el.setAttribute("spellcheck", "false");
        el.setAttribute("enterkeyhint", "done");
        el.setAttribute("aria-hidden", "true");
        el.setAttribute("tabindex", "-1");
        el.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;border:0;padding:0;" +
                           "margin:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;" +
                           "pointer-events:none;z-index:-1;";
        document.body.appendChild(el);

        var want = false, queue = "", emitted = "", composing = false;
        function reset() { el.value = SENT; emitted = ""; }
        function sync() {
          var v = el.value;
          if (v === "") { queue += "\b"; reset(); return; }          // marker deleted = Backspace
          var text = v.charAt(0) === SENT ? v.slice(1) : v.split(SENT).join("");
          var p = 0, n = Math.min(emitted.length, text.length);
          while (p < n && emitted.charAt(p) === text.charAt(p)) p++;
          for (var i = emitted.length - p; i > 0; i--) queue += "\b";
          queue += text.slice(p);
          emitted = text;
          if (!composing && emitted.length > 24) reset();
        }
        el.addEventListener("input", sync);
        el.addEventListener("compositionstart", function () { composing = true; });
        el.addEventListener("compositionend", function () { composing = false; sync(); reset(); });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { queue += "\n"; e.preventDefault(); }
          else if (e.key === "Tab") { queue += "\t"; e.preventDefault(); }
        });
        function focusNow() {
          if (!want || !isTouch) return;
          if (document.activeElement !== el) { reset(); try { el.focus({ preventScroll: true }); } catch (x) { el.focus(); } }
        }
        window.bigusKb = {
          want: function (on) { want = on; if (!on) { el.blur(); queue = ""; emitted = ""; } },
          open: focusNow,
          has: function () { return queue.length > 0; },
          take: function () { var q = queue; queue = ""; return q; }
        };
        // iPhone only opens the keyboard from a real tap, so do it right in the tap
        ["touchend", "click"].forEach(function (name) {
          canvas.addEventListener(name, focusNow, true);
        });
      })();

      // ---- auto update: if a newer build is uploaded, refresh (never in the middle of a run) ----
      (function () {
        var mine = (loaderUrl.match(/([0-9a-f]{32})\.loader\.js/) || [])[1];
        if (!mine) return;
        var pending = "";
        var note = document.createElement("div");
        note.style.cssText = "position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:none;" +
                             "background:#e8554a;color:#fff;font:600 15px sans-serif;padding:8px 14px;border-radius:8px;";
        note.textContent = "New version ready. It will refresh when your run ends.";
        document.body.appendChild(note);
        function go(id) { location.replace(location.pathname + "?v=" + id); }
        function tick() {
          if (pending) {
            if (!window.bigusRunActive) go(pending);
            return;
          }
          fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (t) {
              var m = t.match(/([0-9a-f]{32})\.loader\.js/);
              if (!m || m[1] === mine) return;
              pending = m[1];
              if (window.bigusRunActive) note.style.display = "block"; else go(pending);
            })
            .catch(function () {});
        }
        setInterval(tick, 30000);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
        window.addEventListener("online", tick);
      })();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#fill").style.width = (100 * p) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          refit();
          canvas.focus();
        }).catch(function (m) {
          var e = document.querySelector("#err"); e.style.display = "block"; e.textContent = m;
        });
      };
      // asks "Leave site?" while a ranked run is going (the game turns this on and off)
      window.bigusRunActive = false;
      window.addEventListener("beforeunload", function (e) {
        if (window.bigusRunActive) { e.preventDefault(); e.returnValue = ""; return ""; }
      });
      document.body.appendChild(script);
    </script>
  </body>
</html>
