<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bigus Run</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden;
                   position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
                   -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
                   -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; background: #111;
              touch-action: none; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
                 font-family: sans-serif; color: #fff; }
      #loading h1 { font-size: 28px; margin: 0 0 14px; }
      #bar { width: 260px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #e8554a; }
      #err { position: fixed; left: 0; right: 0; bottom: 0; color: #fff; font-family: sans-serif; padding: 8px; display: none; background: #a22; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Bigus Run</h1>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div id="err"></div>
    <script>
      var canvas = document.querySelector("#game");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/6624d8059a847b06a19092a2ee642dae.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/c66f0a2f286e43fff73e5902d45d1b82.data",
        frameworkUrl: buildUrl + "/4172e223905e299de986f3f174e7602d.framework.js",
        codeUrl: buildUrl + "/64f47c614ef09ec9179a7140368f9032.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "TemmieManz",
        productName: "Bigus Run",
        productVersion: "Beta",
        showBanner: function (msg, type) {
          if (type == "error") { var e = document.querySelector("#err"); e.style.display = "block"; e.textContent = msg; }
        }
      };

      // ---- phone / tablet fixes: exact canvas size, no zoom, no scroll, no page gestures ----
      var isTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                    (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
      function fitCanvas() {
        var vv = window.visualViewport;
        var w = Math.round(vv ? vv.width : window.innerWidth);
        var h = Math.round(vv ? vv.height : window.innerHeight);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        // when the keyboard opens, follow the visible part of the page
        canvas.style.left = Math.round(vv ? vv.offsetLeft : 0) + "px";
        canvas.style.top = Math.round(vv ? vv.offsetTop : 0) + "px";
      }
      fitCanvas();
      var fitTimer = 0;
      function refit() {
        fitCanvas();
        clearTimeout(fitTimer);
        // the browser bar / rotation settles a moment later, so fit again and tell the game
        fitTimer = setTimeout(function () { fitCanvas(); window.dispatchEvent(new Event("resize")); }, 250);
      }
      window.addEventListener("resize", refit);
      window.addEventListener("orientationchange", refit);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", refit);
        window.visualViewport.addEventListener("scroll", fitCanvas);
      }
      if (isTouch) {
        var stop = function (e) { if (e.cancelable) e.preventDefault(); };
        document.addEventListener("touchmove", stop, { passive: false });
        document.addEventListener("gesturestart", stop);
        document.addEventListener("gesturechange", stop);
        document.addEventListener("gestureend", stop);
        document.addEventListener("contextmenu", stop);
        var lastTap = 0;
        document.addEventListener("touchend", function (e) {
          var now = Date.now();
          if (now - lastTap < 350) stop(e); // no double tap zoom
          lastTap = now;
        }, { passive: false });
        // sharp enough, but kinder to phones
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      // ---- phone keyboard: a hidden box opens the browser keyboard and sends typing to the game ----
      (function () {
        var SENT = "\u200b";        // marker so Backspace still works when the box is empty
        var el = document.createElement("input");
        el.type = "text";
        el.setAttribute("autocomplete", "off");
        el.setAttribute("autocorrect", "off");
        el.setAttribute("autocapitalize", "off");
        el.setAttribute("spellcheck", "false");
        el.setAttribute("enterkeyhint", "done");
        el.setAttribute("aria-hidden", "true");
        el.setAttribute("tabindex", "-1");
        el.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;border:0;padding:0;" +
                           "margin:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;" +
                           "pointer-events:none;z-index:-1;";
        document.body.appendChild(el);

        var want = false, queue = "", emitted = "", composing = false;
        function reset() { el.value = SENT; emitted = ""; }
        function sync() {
          var v = el.value;
          if (v === "") { queue += "\b"; reset(); return; }          // marker deleted = Backspace
          var text = v.charAt(0) === SENT ? v.slice(1) : v.split(SENT).join("");
          var p = 0, n = Math.min(emitted.length, text.length);
          while (p < n && emitted.charAt(p) === text.charAt(p)) p++;
          for (var i = emitted.length - p; i > 0; i--) queue += "\b";
          queue += text.slice(p);
          emitted = text;
          if (!composing && emitted.length > 24) reset();
        }
        el.addEventListener("input", sync);
        el.addEventListener("compositionstart", function () { composing = true; });
        el.addEventListener("compositionend", function () { composing = false; sync(); reset(); });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { queue += "\n"; e.preventDefault(); }
          else if (e.key === "Tab") { queue += "\t"; e.preventDefault(); }
        });
        function focusNow() {
          if (!want || !isTouch) return;
          if (document.activeElement !== el) { reset(); try { el.focus({ preventScroll: true }); } catch (x) { el.focus(); } }
        }
        window.bigusKb = {
          want: function (on) { want = on; if (!on) { el.blur(); queue = ""; emitted = ""; } },
          open: focusNow,
          has: function () { return queue.length > 0; },
          take: function () { var q = queue; queue = ""; return q; }
        };
        // iPhone only opens the keyboard from a real tap, so do it right in the tap
        ["touchend", "click"].forEach(function (name) {
          canvas.addEventListener(name, focusNow, true);
        });
      })();

      // ---- auto update: if a newer build is uploaded, refresh (never in the middle of a run) ----
      (function () {
        var mine = (loaderUrl.match(/([0-9a-f]{32})\.loader\.js/) || [])[1];
        if (!mine) return;
        var pending = "";
        var note = document.createElement("div");
        note.style.cssText = "position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:none;" +
                             "background:#e8554a;color:#fff;font:600 15px sans-serif;padding:8px 14px;border-radius:8px;";
        note.textContent = "New version ready. It will refresh when your run ends.";
        document.body.appendChild(note);
        function go(id) { location.replace(location.pathname + "?v=" + id); }
        function tick() {
          if (pending) {
            if (!window.bigusRunActive) go(pending);
            return;
          }
          fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (t) {
              var m = t.match(/([0-9a-f]{32})\.loader\.js/);
              if (!m || m[1] === mine) return;
              pending = m[1];
              if (window.bigusRunActive) note.style.display = "block"; else go(pending);
            })
            .catch(function () {});
        }
        setInterval(tick, 30000);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
        window.addEventListener("online", tick);
      })();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#fill").style.width = (100 * p) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          refit();
          canvas.focus();
        }).catch(function (m) {
          var e = document.querySelector("#err"); e.style.display = "block"; e.textContent = m;
        });
      };
      // asks "Leave site?" while a ranked run is going (the game turns this on and off)
      window.bigusRunActive = false;
      window.addEventListener("beforeunload", function (e) {
        if (window.bigusRunActive) { e.preventDefault(); e.returnValue = ""; return ""; }
      });
      document.body.appendChild(script);
    </script>
  </body>
</html>
